<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main>
        <section class="photo">
            <h2 class="photo__title">ARCHITECTURE OF KYIV</h2>

            <div class="photo__grid">
                <div class="photo__item">
                    <img src="./assets/img/kyiv_cathedral.jpg" alt="Kyiv Cathedral" class="photo__img">
                    <div class="photo__overlay"></div>
                    <div class="photo__actions">
                        <button class="photo__icon">
                            <img src="./assets/img/like.png" alt="Like" />
                        </button>
                        <button class="photo__icon">
                            <img src="./assets/img/download.png" alt="Save" />
                        </button>
                    </div>
                    <div class="photo__info">
                        <span class="photo__author">Jezzael Melgoza</span>
                        <span class="photo__date">5 June 2020</span>
                    </div>
                </div>

                <div class="photo__item photo__item_col-2">
                    <img src="./assets/img/motherland_kyiv.jpg" alt="Motherland Kyiv" class="photo__img">
                    <div class="photo__overlay"></div>
                    <div class="photo__actions">
                        <button class="photo__icon">
                            <img src="./assets/img/like.png" alt="Like" />
                        </button>
                        <button class="photo__icon">
                            <img src="./assets/img/download.png" alt="Save" />
                        </button>
                    </div>
                    <div class="photo__info">
                        <span class="photo__author">Tom W</span>
                        <span class="photo__date">30 March 2021</span>
                    </div>
                </div>

                <div class="photo__item photo__item_big">
                    <img src="./assets/img/volodymir_kyiv.jpg" alt="Monument to Vladimir the Great" class="photo__img">
                    <div class="photo__overlay"></div>
                    <div class="photo__actions">
                        <button class="photo__icon">
                            <img src="./assets/img/like.png" alt="Like" />
                        </button>
                        <button class="photo__icon">
                            <img src="./assets/img/download.png" alt="Save" />
                        </button>
                    </div>
                    <div class="photo__info">
                        <span class="photo__author">Johan Mouchet</span>
                        <span class="photo__date">14 August 2019</span>
                    </div>
                </div>

                <div class="photo__item">
                    <img src="./assets/img/central_kyiv.jpg" alt="Central of Kyiv" class="photo__img">
                    <div class="photo__overlay"></div>
                    <div class="photo__actions">
                        <button class="photo__icon">
                            <img src="./assets/img/like.png" alt="Like" />
                        </button>
                        <button class="photo__icon">
                            <img src="./assets/img/download.png" alt="Save" />
                        </button>
                    </div>
                    <div class="photo__info">
                        <span class="photo__author">Federico Di Dio</span>
                        <span class="photo__date">29 October 2020</span>
                    </div>
                </div>

                <div class="photo__item">
                    <img src="./assets/img/lavra.jpg" alt="Kiev-Pechersk Lavra" class="photo__img">
                    <div class="photo__overlay"></div>
                    <div class="photo__actions">
                        <button class="photo__icon">
                            <img src="./assets/img/like.png" alt="Like" />
                        </button>
                        <button class="photo__icon">
                            <img src="./assets/img/download.png" alt="Save" />
                        </button>
                    </div>
                    <div class="photo__info">
                        <span class="photo__author">Casey Horner</span>
                        <span class="photo__date">9 July 2021</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
