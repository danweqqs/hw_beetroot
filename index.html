<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson_5 Figma</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="shopping-list">
        <header class="shopping-list-header">
            <h1>CSS Dinner Shopping List</h1>
            <p>Let’s go to the mall!</p>
        </header>

        <section class="panel">
            <div class="items">
                <div class="item">
                    <input type="checkbox" id="pickles" class="check">
                    <label for="pickles1">A lot of pickles <span class="description">for the next lessons about
                            CSS</span></label>
                </div>

                <div class="item">
                    <input type="checkbox" id="apples" class="check">
                    <label for="apples1">10 apples <span class="description">for more CSS manipulations</span></label>
                </div>

                <div class="item">
                    <input type="checkbox" id="oranges" class="check">
                    <label for="oranges1">20 oranges <span class="description">because they are awesome</span></label>
                </div>

                <div class="item">
                    <input type="checkbox" id="plates" class="check">
                    <label for="plates1">13 plates <span class="description">hm... they always disappear</span></label>
                </div>

                <div class="item">
                    <input type="checkbox" id="bentos" class="check">
                    <label for="bentos1">15 bentos</label>
                </div>

                <div class="item">
                    <input type="checkbox" id="sake" class="check">
                    <label for="sake1">1 bottle of Sake <span class="description">for my friends</span></label>
                </div>
            </div>

            <footer class="footer">
                <button class="button">Bon appetit :)</button>
            </footer>
        </section>
    </div>
</body>

</html>
