<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who’s using</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Tourney:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container header__inner">
            <nav class="nav">
                <div class="lang">
                    <a href="#" class="lang__item">ENG</a>
                </div>
                <div class="breadcrumbs">
                    <a href="#" class="menu__link">Documentation</a>
                    <span class="menu__link">/</span>
                    <a href="#" class="menu__link">Who’s using</a>
                </div>
            </nav>

            <div class="logo">
                <img src="./assets/img/company-logo-black.png" alt="Konstrukt logo">
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="brands">
                <img src="./assets/img/bg-picture.png" alt="background gear" class="bg-image">

                <div class="section-header">
                    <div class="divider"></div>
                    <h2 class="title_2">Who’s using</h2>
                </div>

                <div class="brands__grid">
                    <div class="brand__item"><img src="./assets/img/facebook-logo-black.png" alt="Facebook"></div>
                    <div class="brand__item"><img src="./assets/img/instagram-logo-black.png" alt="Instagram"></div>
                    <div class="brand__item"><img src="./assets/img/shopify-logo-black.png" alt="Shopify"></div>
                    <div class="brand__item"><img src="./assets/img/skype-logo-black.png" alt="Skype"></div>
                    <div class="brand__item"><img src="./assets/img/pinterest-logo-black.png" alt="Pinterest"></div>
                    <div class="brand__item"><img src="./assets/img/wix.com-logo-black.png" alt="Wix"></div>
                    <div class="brand__item"><img src="./assets/img/saleforse-logo-black.png" alt="Salesforce"></div>
                    <div class="brand__item"><img src="./assets/img/soundcloud-logo-black.png" alt="SoundCloud"></div>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
