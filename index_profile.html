<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="main">
        <section class="section">
            <div class="side">
                <h2 class="title_2">Profile</h2>
                <form class="form" action="#" method="post">

                    <div class="row profile-photo">
                        <div class="col col_full">
                            <div class="photo-wrapper">
                                <img src="./assets/img/avatar.jpg" alt="Profile photo" class="photo">

                                <div class="photo-actions-wrapper">
                                    <div class="photo-actions">

                                        <label for="upload" class="photo-upload">
                                            <img src="./assets/img/Photo_Camera.png" alt="Upload">
                                        </label>
                                        <input type="file" id="upload" hidden>

                                        <button type="button" class="photo-delete">
                                            <img src="./assets/img/Trash.png" alt="Delete">
                                        </button>
                                    </div>
                                    <p class="photo-note">Up to 1 MB (300x300 px)</p>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="row">
                        <div class="col col_half">
                            <label for="name" class="label">Name</label>
                            <input type="text" id="name" name="name" placeholder="Enter your name" required>
                        </div>
                        <div class="col col_half">
                            <label for="email" class="label">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col col_half">
                            <label for="country" class="label">Country</label>
                            <select id="country" name="country" required>
                                <option value="" disabled selected hidden>Select</option>
                                <option value="ua">Ukraine</option>
                                <option value="us">USA</option>
                                <option value="pl">Poland</option>
                            </select>

                        </div>
                        <div class="col col_half">
                            <label for="city" class="label">City</label>
                            <input type="text" id="city" name="city" placeholder="Enter your city" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col col_half">
                            <label for="zip" class="label">Zip Code</label>
                            <input type="text" id="zip" name="zip" placeholder="Enter your zip code">
                        </div>
                        <div class="col col_half">
                            <label for="phone" class="label">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="+380 ХХ ХХХХХХХ">
                        </div>
                    </div>

                    <div class="row">
                        <button type="submit" class="btn btn_min">Update</button>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>

</html>
